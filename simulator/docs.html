  <main class="doc"><article id="docArticle"><p class="doc-status">Loading…</p></article></main>
</div>

<script>
'use strict';

/* This page only exists for the browser simulator — a design/reference tool, not
   something the ESP32 itself ever hosts. firmware/data/index.html (the real device's
   own served upload page) is a separate, much smaller file with no docs anywhere near
   it; keeping this split means the simulator's own reference material never has to be
   thought about while working on that page. */
const DOCS = [
  { slug: 'about', file: 'ABOUT.md', label: 'About', desc: 'What this is, and who built it', group: 'The project' },
  { slug: 'divergences', file: 'HARDWARE_DIVERGENCES.md', label: 'Hardware divergences', desc: 'Where the simulator differs', group: 'The project' },
  { slug: 'firmware-review', file: 'FIRMWARE_REVIEW.md', label: 'Firmware review', desc: 'Bugs found, parity with this page', group: 'The project' },
  { slug: 'architecture', file: 'ARCHITECTURE.md', label: 'Architecture', desc: 'Converter → device pipeline', group: 'Reference' },
  { slug: 'format', file: 'FORMAT.md', label: '.cebk format', desc: 'Binary book format (v1)', group: 'Reference' },
  { slug: 'flash-budget', file: 'FLASH_BUDGET.md', label: 'Flash & RAM budget', desc: 'What fits, what needs porting', group: 'Reference' },
  { slug: 'simulator', file: 'SIMULATOR.md', label: 'Simulator UI/UX', desc: 'Input model, screens, persistence', group: 'Reference' },
];
const DEFAULT_SLUG = DOCS[0].slug;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function slugify(text) {
  return text
    .toLowerCase()
    .replace(/[`*_]/g, '')
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-');
}

// Inline spans only — code/bold/italic/links — applied to already-HTML-escaped text so
// the regexes only ever see markdown punctuation, never raw user/doc content as markup.
function renderInline(escaped) {
  return escaped
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) => {
      const external = /^https?:\/\//.test(href);
      return `<a href="${escapeHtml(href)}"${external ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
    });
}

function splitTableRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  // Split on unescaped pipes only — a literal "|" inside a cell can be written as "\|".
  return s.split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
}

const BLOCK_START = /^(#{1,6}\s+|[-*]\s+|\d+\.\s+|```)/;

// Small hand-rolled renderer covering exactly what these four docs actually use
// (checked against them directly): headings, paragraphs with lazy line-wrap
// continuation, single-level bulleted/numbered lists, fenced code blocks, and GFM
// pipe tables. Not a general CommonMark implementation — doesn't need to be one.
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const out = [];
  const usedIds = new Set();
  let openList = null; // { tag: 'ul'|'ol', items: [] }

  function uniqueId(base) {
    let id = base || 'section';
    let n = 2;
    while (usedIds.has(id)) id = `${base}-${n++}`;
    usedIds.add(id);
    return id;
  }
  function flushList() {
    if (!openList) return;
    const items = openList.items.map((raw) => `<li>${renderInline(escapeHtml(raw))}</li>`).join('');
    out.push(`<${openList.tag}>${items}</${openList.tag}>`);
    openList = null;
  }
  function isBlockBoundary(line) {
    return line.trim() === '' || BLOCK_START.test(line) || /^\s*\|.+\|\s*$/.test(line);
  }

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flushList();
      const code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; // skip closing fence
      out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
      continue;
    }

    if (/^\s*\|.+\|\s*$/.test(line) && lines[i + 1] && /^\s*\|?[\s:-]+\|[\s:|-]*\|?\s*$/.test(lines[i + 1])) {
      flushList();
      const header = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) { rows.push(splitTableRow(lines[i])); i++; }
      const thead = `<tr>${header.map((c) => `<th>${renderInline(escapeHtml(c))}</th>`).join('')}</tr>`;
      const tbody = rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(escapeHtml(c))}</td>`).join('')}</tr>`).join('');
      out.push(`<div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      flushList();
      const level = heading[1].length;
      const text = heading[2].trim();
      const id = uniqueId(slugify(text));
      out.push(`<h${level} id="${id}">${renderInline(escapeHtml(text))}</h${level}>`);
      i++;
      continue;
    }

    if (!line.trim()) { flushList(); i++; continue; }

    const bullet = line.match(/^[-*]\s+(.+)$/);
    const numbered = line.match(/^\d+\.\s+(.+)$/);
    if (bullet || numbered) {
      const tag = numbered ? 'ol' : 'ul';
      if (!openList || openList.tag !== tag) { flushList(); openList = { tag, items: [] }; }
      let text = (bullet || numbered)[1];
      i++;
      while (i < lines.length && lines[i].trim() && !isBlockBoundary(lines[i])) { text += ' ' + lines[i].trim(); i++; }
      openList.items.push(text);
      continue;
    }

    // Plain paragraph — lazily continues over following non-blank, non-block-start lines.
    flushList();
    let text = line.trim();
    i++;
    while (i < lines.length && lines[i].trim() && !isBlockBoundary(lines[i])) { text += ' ' + lines[i].trim(); i++; }
    out.push(`<p>${renderInline(escapeHtml(text))}</p>`);
  }
  flushList();
  return out.join('\n');
}

function renderIndex(activeSlug) {
  const nav = document.getElementById('docIndex');
  const groups = [];
  for (const d of DOCS) {
    let g = groups.find((x) => x.name === d.group);
    if (!g) groups.push((g = { name: d.group, items: [] }));
    g.items.push(d);
  }
  nav.innerHTML = groups.map((g) => `
    <p class="index-label">${escapeHtml(g.name)}</p>
    <ul>${g.items.map((d) => `
      <li><a href="#${d.slug}" class="${d.slug === activeSlug ? 'active' : ''}">${escapeHtml(d.label)}<span class="desc">${escapeHtml(d.desc)}</span></a></li>
    `).join('')}</ul>
  `).join('');
}

const docCache = new Map();
async function loadDoc(slug) {
  const doc = DOCS.find((d) => d.slug === slug) || DOCS[0];
  renderIndex(doc.slug);
  const article = document.getElementById('docArticle');
  article.innerHTML = '<p class="doc-status">Loading…</p>';
  try {
    let text = docCache.get(doc.file);
    if (text === undefined) {
      const res = await fetch('docs/' + doc.file, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      text = await res.text();
      docCache.set(doc.file, text);
    }
    article.innerHTML = renderMarkdown(text);
    window.scrollTo({ top: 0 });
  } catch (err) {
    const ghUrl = `https://github.com/trimpta/esp32-epaper-ereader/blob/master/docs/${doc.file}`;
    article.innerHTML = `<p class="doc-status err">Couldn't load <code>docs/${escapeHtml(doc.file)}</code> here (${escapeHtml(err.message)}).
      That means this page isn't being served with the <code>docs/</code> folder alongside it — true for a bare
      <code>file://</code> open or a server started somewhere that doesn't include it.
      <a href="${ghUrl}" target="_blank" rel="noopener">Read it on GitHub instead →</a></p>`;
  }
}

function currentSlug() {
  const hash = location.hash.replace(/^#/, '');
  return DOCS.some((d) => d.slug === hash) ? hash : DEFAULT_SLUG;
}

window.addEventListener('hashchange', () => loadDoc(currentSlug()));
loadDoc(currentSlug());
</script>
<script src="theme.js"></script>
</body>
