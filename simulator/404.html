<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Rotary Reader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="site.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('rotaryReaderTheme_v1');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  main.wrap {
    padding-top: clamp(3rem, 12vw, 6rem);
    padding-bottom: 5rem;
    max-width: 560px;
    text-align: center;
  }
  .code { font-family: 'IBM Plex Mono', monospace; color: var(--ink-3); font-size: 0.85rem; margin: 0 0 0.6rem; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 0.8rem; }
  p.lede { color: var(--ink-2); margin: 0 0 2rem; }
  a.btn {
    display: inline-block;
    text-decoration: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 0.55rem 1.2rem;
    font-size: 0.9rem;
  }
  a.btn:hover { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<main class="wrap">
  <p class="code">404</p>
  <h1>That page turned out to be blank.</h1>
  <p class="lede">Nothing's here — the link may be old, or mistyped.</p>
  <a class="btn" href="./">Back to Rotary Reader</a>
</main>
</body>
</html>
