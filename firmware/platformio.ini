; PlatformIO project for the CrowPanel ESP32 2.13" E-Paper (ESP32-S3, 8MB flash, 8MB PSRAM).
;
; TODO(verify): board id below is a generic ESP32-S3 devkit target — swap for Elecrow's exact
; board definition once confirmed (flash/PSRAM mode and pin defaults can differ between S3 boards).
; TODO(verify): GxEPD2 driver class in src/renderer.cpp needs confirming against SSD1680Z/JD79661 —
; see README.md for why.

[env:crowpanel-esp32s3-213]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Explicit, checked-in table (partitions.csv) instead of a platform-provided default —
; see docs/FLASH_BUDGET.md for the exact byte accounting and why single-app (no OTA)
; matters on a board with no SD slot.
board_build.partitions = partitions.csv

lib_deps =
    zinggjm/GxEPD2 @ ^1.5.9
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    tzapu/WiFiManager @ ^2.0.17
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
